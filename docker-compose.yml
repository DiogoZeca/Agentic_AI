# CPU Spike Prediction — Docker Compose
#
#   Test suite:
#     docker compose --profile test run --rm --build test
#
#   API service (requires trained artifacts in data/full_run/):
#     docker compose up --build
#
#   Training run (on VM or local — writes artifacts to data/full_run/):
#     docker compose --profile train run --rm --build train

services:

  test:
    build:
      context: ./AIModel
      dockerfile: Dockerfile.test
    container_name: spike-test
    volumes:
      - ./AIModel/data:/app/data
    profiles: [test]

  api:
    build:
      context: ./AIModel
      dockerfile: Dockerfile
    container_name: spike-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/data/full_run/models/spike
    volumes:
      # Model artifacts mounted read-only — update model without rebuilding image
      - ./AIModel/data/full_run:/app/data/full_run:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  train:
    build:
      context: ./AIModel
      dockerfile: Dockerfile.training
    container_name: spike-train
    volumes:
      # Data mounted read-only; artifacts dir writable for output
      - ./AIModel/data:/app/data
    profiles: [train]
