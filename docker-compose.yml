# CPU Power Spike Prediction — Docker Compose
#
#   Test suite:
#     docker compose --profile test run --rm test
#
#   API service:
#     docker compose up --build

services:

  test:
    build:
      context: ./AIModel
      dockerfile: Dockerfile.test
    container_name: cpu-power-test
    volumes:
      - ./AIModel/data:/app/data
    profiles: [test]

  api:
    build:
      context: ./AIModel
      dockerfile: Dockerfile
    container_name: cpu-power-api
    ports:
      - "8000:8000"
    volumes:
      - ./AIModel/data:/app/data
    environment:
      DATA_PATH: data/cpu_data.dat
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
