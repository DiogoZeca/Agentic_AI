# CPU Spike Prediction — Docker Compose
#
#   Test suite:
#     docker compose --profile test run --rm --build test
#
#   API service (requires trained artifacts in data/full_run/):
#     docker compose up --build
#
#   Training run (local):
#     docker compose --profile train run --rm --build train
#
#   Training run (remote VM via SSH — bind mounts resolve on the remote host,
#   so run docker compose FROM the VM, not via DOCKER_HOST):
#     ssh spike-vm "bash -lc 'cd ~/spike && \
#       CASCADE_STAGE2_OVR=true TRAIN_OVR_ONLY=true FROM_STEP=3 \
#       ARTIFACTS_DIR=data/experiments/cascade_stage2 \
#       docker compose --profile train run -d --rm --build train'"
#
#   DATA_ROOT overrides the host-side data directory (default: ./data).

services:

  test:
    build:
      context: .
      dockerfile: tests/Dockerfile.test
    container_name: spike-test
    volumes:
      - ${DATA_ROOT:-./data}:/app/data
    profiles: [test]

  api:
    build:
      context: .
      dockerfile: spike/Dockerfile
    container_name: spike-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/data/full_run/models/spike
    volumes:
      # Model artifacts mounted read-only — update model without rebuilding image
      - ./data/full_run:/app/data/full_run:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  train:
    build:
      context: .
      dockerfile: training/Dockerfile.training
    container_name: spike-train
    environment:
      # Set DEVICE=cuda to use the GPU; _resolve_device() falls back to CPU if
      # no CUDA GPU is found, so this compose file also works on CPU-only hosts.
      - DEVICE=cuda
      - DATA_PATH=${DATA_PATH:-data/cluster_cpu_data.csv}
      - ARTIFACTS_DIR=${ARTIFACTS_DIR:-data/full_run}
      - OPTUNA_TRIALS=${OPTUNA_TRIALS:-150}
      - MIN_FUTURE_WINDOWS=${MIN_FUTURE_WINDOWS:-2}
      - N_ESTIMATORS=${N_ESTIMATORS:-4000}
      - CASCADE_STAGE2_OVR=${CASCADE_STAGE2_OVR:-false}
      - TRAIN_OVR_ONLY=${TRAIN_OVR_ONLY:-false}
      - FROM_STEP=${FROM_STEP:-1}
    volumes:
      # Input CSV (read) + artifact output (write) both under the same mount.
      # Trained models are accessible from the host at ./data/full_run/.
      - ${DATA_ROOT:-./data}:/app/data
    deploy:
      resources:
        reservations:
          devices:
            # 'capabilities: [gpu]' is mandatory — omitting it ignores the GPU
            # silently.  Requires NVIDIA Container Toolkit on the host.
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: [train]
