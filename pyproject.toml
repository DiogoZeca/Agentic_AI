[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-spike-predictor"
version = "0.1.0"
description = "XGBoost-based CPU spike prediction for datacenter scheduling"
requires-python = ">=3.10"
dependencies = [
    "xgboost>=3.2.0,<4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=12.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["spike*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
